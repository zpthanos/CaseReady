name: Capture live application

on:
  push:
    branches: [main]
    paths:
      - .github/qa/live-url.txt

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install the Chromium test browser
        run: npx playwright install --with-deps chromium
      - name: Capture the deployed application
        run: node scripts/capture-live-screenshots.mjs .github/qa/live-url.txt
      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: caseready-live-screenshots
          path: qa-output/
          if-no-files-found: error
          retention-days: 7
