  <text x="76" y="250" fill="#14242d" font-family="Georgia, serif" font-size="64" letter-spacing="-2">One careful intake.</text>
  <text x="76" y="330" fill="#14242d" font-family="Georgia, serif" font-size="64" letter-spacing="-2">The right next message.</text>
  <text x="80" y="397" fill="#526169" font-family="Arial, sans-serif" font-size="24">Deterministic, reviewable support handoffs that stay in the browser.</text>
