<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">CaseReady — guided support intake</title>
  <desc id="description">One guided intake produces clear outputs for customers, support and engineering.</desc>
  <rect width="1280" height="640" fill="#f3f0e8"/>
  <rect x="76" y="72" width="56" height="56" fill="#176a63"/>
  <rect x="88" y="84" width="14" height="32" fill="#fbfaf6"/>
