  <text x="80" y="569" fill="#647178" font-family="Arial, sans-serif" font-size="17">Customer support · technical delivery · clear ownership</text>
  <rect x="888" y="92" width="312" height="132" fill="#e6f0ed"/>
  <rect x="888" y="254" width="312" height="132" fill="#f1e8d9"/>
