  <text x="927" y="143" fill="#176a63" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">CUSTOMER</text>
  <text x="927" y="180" fill="#14242d" font-family="Arial, sans-serif" font-size="20" font-weight="700">Ownership and next update</text>
